name: Test

on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# HA `dev` must test against unreleased pyimouapi on library `dev`.
# HA `main` / PRs into `main` follow the published library on `main`.
env:
  PYIMOUAPI_REF: ${{ github.event.pull_request.base.ref || github.ref_name }}

jobs:
  test:
    name: Test (HA ${{ matrix.ha-label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Matches hacs.json / pyproject.toml floor (Home Assistant 2025.4.x).
          - leg: min
            ha-label: "2025.4"
            python-version: "3.13"
          # Current stable users hit (e.g. via_device → via_device_id on 2026.9).
          - leg: latest
            ha-label: "2026.9"
            python-version: "3.14"
            ha-version: "2026.9.2"
            phccc-version: "0.13.365"
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: Imou-OpenPlatform/Py-Imou-Open-Api
          path: Py-Imou-Open-Api
          ref: ${{ env.PYIMOUAPI_REF }}
      - name: Link pyimouapi for uv path dependency
        run: ln -sfn "$GITHUB_WORKSPACE/Py-Imou-Open-Api" "$(dirname "$GITHUB_WORKSPACE")/Py-Imou-Open-Api"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Sync min-lane dependencies
        if: matrix.leg == 'min'
        run: uv sync --dev
      - name: Sync latest-lane dependencies
        if: matrix.leg == 'latest'
        run: |
          # Do not use the locked 2025.4 PHCCC tree on Python 3.14 — its
          # pydantic-core cannot build. Install the 2026.9 pair into a fresh venv.
          sudo apt-get update
          sudo apt-get install -y libturbojpeg0-dev
          uv venv --python "${{ matrix.python-version }}"
          uv pip install \
            -e "$GITHUB_WORKSPACE/Py-Imou-Open-Api" \
            "homeassistant==${{ matrix.ha-version }}" \
            "pytest-homeassistant-custom-component==${{ matrix.phccc-version }}" \
            "pytest-asyncio>=0.24.0" \
            "pytest-timeout>=2.3.0" \
            PyTurboJPEG
      - name: Record resolved Home Assistant version
        run: |
          # Latest lane installs outside the lock; --no-sync keeps that env.
          uv run --no-sync python - <<'PY'
          from homeassistant.const import __version__
          print(f"homeassistant=={__version__}")
          PY
      - run: uv run --no-sync pytest tests/ -q --timeout=30
