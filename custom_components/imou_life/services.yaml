control_move_ptz:
  target:
    entity:
      domain: button
      integration: imou_life
  fields:
    duration:
      required: false
      default: 500
      example: 500
      selector:
        number:
          min: 100
          max: 10000
          unit_of_measurement: ms
device_snap_detect:
  target:
    entity:
      integration: imou_life
  fields:
    notify_targets:
      required: false
      example: ["notify.mobile_app_phone"]
      selector:
        object:
search_ai_alarms:
  target:
    entity:
      integration: imou_life
  fields:
    keyword:
      required: true
      example: "person in black coat"
      selector:
        text:
    days:
      required: false
      default: 7
      selector:
        number:
          min: 1
          max: 31
          unit_of_measurement: days
refresh_ai_insight_briefing:
  target:
    entity:
      integration: imou_life
  fields:
    end_date:
      required: false
      example: "2026-11-12"
      selector:
        date:
